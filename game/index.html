<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Heat: Vice Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce, and the self-test log. */
  #status, #test-results { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Palmera Heat: Vice Run — a top-down open-world crime game. Walk and drive with WASD, enter cars with E, aim with the mouse, shoot with the left mouse button."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="test-results" aria-hidden="true"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
